# Starts a PostgreSQL database for MiniLedger.
# Run: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger
      POSTGRES_DB: miniledger
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
